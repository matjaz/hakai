[package]
name = "hakai-core"
version = "0.0.1"
edition = "2021"
description = "hakai's headless raster/game-logic core — SplitMix64, the tiled damage layer, procedural decals/icons/sprites, all nine tools, the termite colony. No window, no audio, no compositor — builds and tests on any OS."
license = "MIT"
repository = "https://github.com/matjaz/hakai"
readme = "../README.md"

[lib]
name = "hakai_core"
path = "src/lib.rs"

[features]
# The GPU renderer — pipelines, the per-frame draw, HUD text shaping, and the
# platform-agnostic scene `State`/`GpuLayer`. Off by default so `cargo test` (and the
# headless CI job) stay exactly as light as before: no wgpu, no cosmic-text. The two
# binaries (`hakai`, `hakai-win`) turn it on; each still owns its own window, event loop
# and screen-capture backend.
render = ["dep:wgpu", "dep:bytemuck", "dep:cosmic-text", "dep:raw-window-handle"]

[dependencies]
# If cargo can't resolve this (a breaking 0.12+ is out and old 0.11.x got yanked, which
# is unlikely but not impossible), relax to "0.12" or whatever `cargo add tiny-skia`
# resolves to — nothing in this crate depends on 0.11-specific behaviour.
tiny-skia = "0.11"
# Glyph outline extraction for the stamp decal's text — see src/fonts.rs. Only its
# `OutlineBuilder` trait and `Face::parse`/`glyph_index`/`outline_glyph` are used, which
# have been stable across ttf-parser's whole 0.2x line, so a version bump here shouldn't
# need code changes.
ttf-parser = "0.24"
# Parses the bundled `assets/manifest.json` for the credits panel — see src/credits.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- `render` feature only (see [features] above) ---------------------------------------
# Kept in lockstep with both binaries' own pins. wgpu 30: the Windows binary needs 27+ for
# its DirectComposition transparency path; the Linux binary was bumped to match.
wgpu = { version = "30", optional = true }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# HUD text — real shaping/rasterization (arbitrary tool names, licence text, credits)
# rather than the hand-traced glyph outlines `fonts.rs` uses for the stamp decal. See
# src/render/text.rs for the version RISK notes carried over from the port.
cosmic-text = { version = "0.12", optional = true }
