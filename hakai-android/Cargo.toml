[package]
name = "hakai-android"
version = "1.2.0"
edition = "2021"
description = "Smash, burn and repaint your screen — the Android build of hakai."
license = "MIT"
repository = "https://github.com/matjaz/hakai"
readme = "../README.md"

[lib]
# Loaded by Android's NativeActivity as libhakai.so.
name = "hakai"
crate-type = ["cdylib"]

[profile.release]
strip = true

[dependencies]
# The renderer, scene, winit shell and cpal audio (AAudio here) — everything but the
# Android hooks below.
hakai-core = { path = "../hakai-core", features = ["shell", "playback"] }

# Only the instance setup names wgpu here — Vulkan, with GLES as the fallback.
wgpu = "30"

log = "0.4"
android_logger = "0.15"

# winit's Android backend runs on android-activity's NativeActivity glue — no Java code
# of our own. Feature-unified with the winit hakai-core's shell already uses.
winit = { version = "0.30", features = ["android-native-activity"] }
# The AndroidApp handed to android_main, and JNI for the one Java call we need
# (Window.setFormat). Same versions winit 0.30 itself pulls in.
android-activity = "0.6"
jni = "0.22"

# --- cargo-apk: the APK's manifest -------------------------------------------------------
[package.metadata.android]
package = "si.intera.hakai"
apk_name = "hakai"
build_targets = ["aarch64-linux-android"]
# Shipped as hakai-core's procedural app icon (see package.sh).
resources = "res"

[package.metadata.android.sdk]
# AAudio (cpal's Android backend) needs 26.
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Hakai"
icon = "@mipmap/ic_launcher"
# Translucent: whatever's underneath — the home screen hakai was launched from — stays
# visible, so hakai smashes the real screen rather than a picture of it, with no special
# permission. NoTitleBar.Fullscreen hides the status bar too.
theme = "@android:style/Theme.Translucent.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
# The HUD and the tool palette are laid out for ≥ 800 points of width — landscape on a
# phone.
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"
launch_mode = "singleTask"
