[package]
name = "hakai"
version = "0.0.1"
edition = "2021"
description = "Phase 0 spike: a wlr-layer-shell overlay rendered with wgpu, on every output."

[[bin]]
name = "hakai"
path = "src/main.rs"

[dependencies]
# The whole headless core (Phases 1–3: damage layer, decals, icons, sprites, tools,
# termite colony, simulation) — a plain relative path dependency to the sibling crate
# rather than a formal Cargo workspace. A workspace would also work, but this is the same
# functional outcome (this crate can `use hakai_core::...`) with far less risk to two
# already-working, separately-tested setups: no Cargo.lock merge, no target-dir path
# changes on either side.
hakai-core = { path = "../hakai-core" }
# hakai-core's own dependency, pinned to match — needed here too since main.rs names
# `tiny_skia::Pixmap` directly (icon upload), and Rust won't let a crate reference a
# transitive dependency's types without also depending on it.
tiny-skia = "0.11"

# Pulling wayland-client/calloop through sctk's re-exports (rather than depending on our
# own copies) so versions can never drift apart underneath us. The one exception is the
# explicit wayland-backend line below: "client_system" switches the client backend from
# the pure-Rust protocol reimplementation to dlopen'd libwayland-client.so. That matters
# here because Vulkan's Wayland WSI (which wgpu drives) expects a real libwayland-client
# wl_display/wl_surface pointer — handing it a pointer from the pure-Rust backend is a
# crash, not a type error. The feature lives on wayland-backend, not on wayland-client
# itself (wayland-client 0.31 doesn't forward it) — Cargo's feature unification still
# applies it to the copy of wayland-backend that both wayland-client and
# smithay-client-toolkit pull in, as long as all three resolve to compatible versions.
smithay-client-toolkit = "0.19"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
calloop = "0.13"
calloop-wayland-source = "0.3"

wgpu = "22"
raw-window-handle = "0.6"
pollster = "0.3"
# POD → bytes for the per-tile uniform buffer (tile placement, already converted to clip
# space on the Rust side — see shader.wgsl).
bytemuck = { version = "1", features = ["derive"] }

env_logger = "0.11"
log = "0.4"

# HUD text (the tool-name label, hint bar, palette digits, credits panel) — real font
# shaping rather than the outline-tracing `ttf-parser` approach `hakai-core`'s stamp decal
# uses, since HUD text is arbitrary strings (tool names, credits, licence text) rather than
# a handful of known short words worth hand-building paths for. RISK: cosmic-text's
# convenience API (`Buffer::draw`'s per-pixel callback, `FontSystem`'s constructors) has
# shifted across its 0.1x releases in ways I can't verify without crates.io access to the
# exact docs for whatever version resolves here — see the RISK comments in `text.rs`.
cosmic-text = "0.12"

# Phase 5: real audio. `cpal` is a long-established, stable-API crate (unlike
# `cosmic-text`) — higher confidence here than anywhere else new in this port, though
# still genuinely new ground: everything else that's touched an OS-level API so far
# (`wgpu`, `smithay-client-toolkit`, `wayland-backend`) has been GPU/compositor-side;
# `cpal` talks to a completely different subsystem (ALSA/PipeWire), on its own dedicated
# realtime audio-callback thread. `hound` decodes the bundled WAVs (all confirmed mono,
# 16-bit PCM, 44.1kHz — `file assets/sounds/*.wav`) into the `f32` samples `cpal` wants.
cpal = "0.18"
hound = "3"

# Phase 6: screen capture, for the brightness-driven impact sound
# (`hakai_core::audio::smash_name`, already ported, unused until now — it falls back to a
# random variant when `ToolContext.brightness` is `None`, which is all this port has ever
# passed it). `zwlr_screencopy_manager_v1`/`zwlr_screencopy_frame_v1` are wlroots-specific
# — not something `smithay-client-toolkit` wraps — so this crate's raw generated bindings
# are used directly, the same way `wayland-client`'s own `Dispatch` machinery already
# drives every other protocol object in `main.rs`. Pinned to a `wayland-client` line
# (`^0.31.14`) compatible with what's already depended on above, so Cargo unifies to one
# copy rather than two.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Phase 6, chunk 3: `wp_fractional_scale_v1` (a staging protocol) + `wp_viewporter`
# (stable) — correct rendering on a non-integer output scale (1.25x, 1.5x, ...). Both are
# generic (non-wlroots) protocols, from the sibling `wayland-protocols` crate rather than
# `wayland-protocols-wlr` above. `staging` is required for fractional-scale specifically —
# `client`+`staging` together, per the crate's own feature-flag docs.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
