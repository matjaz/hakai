[package]
name = "hakai-mac"
version = "1.3.0"
edition = "2021"
description = "Smash, burn and repaint your desktop — the macOS build of hakai."
license = "MIT"
repository = "https://github.com/matjaz/hakai"
readme = "README.txt"

# The binary inside Hakai.app is `hakai`; `hakai-mac` is just the crate.
[[bin]]
name = "hakai"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
# The headless core plus — behind its `shell` feature — the renderer, scene and the winit
# shell (windows, event loop, input) shared with the Windows build. This crate is just
# the macOS hooks: window level, CoreGraphics capture, ⌘Q.
hakai-core = { path = "../hakai-core", features = ["shell", "playback"] }

# Only the instance setup names wgpu here. Metal offers a non-opaque CAMetalLayer
# (PostMultiplied), which is all a transparent overlay needs on macOS.
wgpu = "30"
raw-window-handle = "0.6"

env_logger = "0.11"
log = "0.4"

# Audio comes from hakai-core's `playback` feature (cpal picks the CoreAudio host here).

# AppKit escape hatches — the window level, Spaces behaviour and frame that winit doesn't
# expose. Plain msg_send! on raw pointers; no typed AppKit bindings needed.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
