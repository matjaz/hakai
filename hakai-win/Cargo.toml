[package]
name = "hakai-win"
version = "1.4.0"
edition = "2021"
description = "Smash, burn and repaint your desktop — the Windows build of hakai."
license = "MIT"
repository = "https://github.com/matjaz/hakai"
readme = "README.txt"

# The exe is `hakai.exe` — what the user sees; `hakai-win` is just the crate.
[[bin]]
name = "hakai"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
# The headless core — the damage layer, all nine tools, decal/icon/sprite generators, the
# termite colony, particles, HUD/credits logic. Identical to what the Linux binary depends
# on; nothing in it is platform-specific.
# The renderer, scene and winit shell (windows, event loop, input) live in hakai-core
# behind its `shell` feature, shared with the macOS build — this crate is down to the
# Windows hooks: DirectComposition, DXGI capture, the global Esc hotkey.
hakai-core = { path = "../hakai-core", features = ["shell", "playback"] }

# wgpu 30: Phase 0 found wgpu 22's D3D12 backend only offers CompositeAlphaMode::Opaque on
# a plain HWND; wgpu 27+ added Dx12SwapchainKind::DxgiFromVisual (a DirectComposition
# presentation path) which does support transparency. The Linux binary was bumped to match.
# Only the instance/adapter/device/surface setup names wgpu here now.
wgpu = "30"
raw-window-handle = "0.6"

env_logger = "0.11"
log = "0.4"

# HUD text shaping (`cosmic-text`) now comes from `hakai_core::render::text` via the
# `render` feature above — no direct dep here any more.

# Audio comes from hakai-core's `playback` feature (cpal picks the WASAPI host here).

# Win32 escape hatches + (Phase 4) DXGI Desktop Duplication for screen capture. Matches
# the copy wgpu-hal 30 pulls in, so there's one unified `windows` in the tree.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
    # DXGI Desktop Duplication — the brightness-under-cursor capture (Phase 4).
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
