name: CI

# Every build job below also packages its platform's release artifact and uploads it, so
# a `v*` tag push builds each binary exactly once: the `release` job at the bottom only
# collects those artifacts and publishes them — it never compiles anything itself.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # hakai-core is deliberately headless (see its own crate doc comment) — no Wayland, no
  # audio, no compositor, so this runs on a plain Ubuntu runner with nothing extra
  # installed. High confidence this job is right: it's the same `cargo test` / `cargo run
  # --example` invocations already used throughout local development.
  hakai-core:
    name: hakai-core (headless — test + gen_credits --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hakai-core

      - name: cargo test
        run: cargo test --manifest-path hakai-core/Cargo.toml --locked

      - name: CREDITS.md is in sync with its sources
        # No explicit path needed — gen_credits defaults to ../CREDITS.md relative to
        # CARGO_MANIFEST_DIR (hakai-core/), which cargo sets from --manifest-path
        # regardless of the invocation's own working directory.
        run: cargo run --manifest-path hakai-core/Cargo.toml --example gen_credits --locked -- --check

  # hakai-linux (the `hakai` command) needs real Wayland/ALSA/Vulkan dev headers to compile at all —
  # smithay-client-toolkit/wayland-backend/cpal all link against or probe for them via
  # build.rs, even though the actual libraries are dlopen'd at runtime, not link-time.
  # Build-only: there's no real compositor in CI, so this can't run `hakai` itself, only
  # confirm it compiles — the "headless-Hyprland smoke run" mentioned in OMARCHY-PORT.md's
  # Phase 8 exit criterion is real, harder problem (a nested/virtual compositor actually
  # accepting hakai's layer-shell surface) genuinely deferred, not attempted here: it needs
  # to be worked out and verified against a real setup before it's worth scripting into CI,
  # not guessed at blind.
  #
  # Both architectures: x86_64 and aarch64 (Omarchy on ARM), each on a native runner.
  # Deliberately on Ubuntu 22.04, not -latest: glibc is backwards-compatible, so the oldest
  # build base sets the floor for every distro the one binary (and its .deb/.rpm) runs on —
  # glibc 2.35 covers Ubuntu 22.04+, Debian 12+, Fedora 36+.
  hakai-linux:
    name: hakai-linux (${{ matrix.arch }} — build + package, no compositor in CI)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, nfpm: x86_64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, nfpm: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hakai-linux
          key: ${{ matrix.arch }}

      - name: Install Wayland/xkbcommon/ALSA/Vulkan dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libasound2-dev libvulkan-dev pkg-config

      - name: Install nfpm (wraps the built binary as .deb/.rpm)
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build + package (hakai-linux/package.sh → tarball, .deb, .rpm)
        run: hakai-linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hakai-linux-${{ matrix.arch }}
          path: |
            hakai-linux/target/hakai-*-linux-*.tar.gz
            hakai-linux/target/hakai_*.deb
            hakai-linux/target/hakai-*.rpm
          if-no-files-found: error
          retention-days: 14

  # hakai-win (the Windows binary). windows-latest ships the MSVC toolchain, so no setup
  # beyond rustup. Build-only: GitHub's runners have no interactive desktop session, so
  # the window, the DirectComposition surface and Desktop Duplication can be compiled but
  # never exercised — this job's job is to catch Windows-only compile breakage (a wgpu 30
  # API drift, a `windows` crate bump) on every push, since day-to-day development happens
  # on Linux. hakai-core's own tests run on Windows here too, cheaply, as a cross-check
  # that the headless core stays platform-clean.
  hakai-win:
    name: hakai-win (Windows binary — build + package, no desktop in CI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hakai-win

      - name: cargo test (hakai-core, on Windows)
        run: cargo test --manifest-path hakai-core/Cargo.toml --locked

      - name: Build + package (hakai-win/package.ps1)
        shell: pwsh
        run: ./hakai-win/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: hakai-win
          path: hakai-win/target/hakai-*-windows-*.zip
          if-no-files-found: error
          retention-days: 14

  # hakai-mac (the macOS binary). Build-only for the same reason as hakai-win: no
  # interactive session on the runner, so the overlay, Metal surface and screen capture
  # compile but never run. Both architectures, since the release DMG is a universal binary.
  # Ad-hoc signed — there's no Developer ID in CI (see hakai-mac/package.sh to add one).
  hakai-mac:
    name: hakai-mac (macOS binary — build + package, universal DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hakai-mac

      - name: Build + package (hakai-mac/package.sh — arm64 + x86_64 → universal DMG)
        run: hakai-mac/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hakai-mac
          path: hakai-mac/target/hakai-*-macos-*.dmg
          if-no-files-found: error
          retention-days: 14

  # hakai-android (an arm64 APK). Build-only like the rest. GitHub's Ubuntu runners ship
  # the Android SDK, an NDK and JDK 17 — everything package.sh assembles the APK with; this
  # only adds the API 35 platform (the newest an NDK r27–r29 accepts).
  #
  # Signing: with the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets set, the
  # APK is signed with that release key — required for users to install one release over
  # another. Without them it's signed with a throwaway debug key made on the runner, so
  # every release would need an uninstall first.
  hakai-android:
    name: hakai-android (arm64 APK — build + package, no device in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hakai-android
            hakai-core

      - name: Install the API 35 platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" >/dev/null'

      - name: Build + package (hakai-android/package.sh → APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          hakai-android/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hakai-android
          path: hakai-android/target/hakai-*-android-*.apk
          if-no-files-found: error
          retention-days: 14

  # Tag pushes only: gather the artifacts the jobs above already built and publish them as
  # a GitHub release. The tag must match the crates' version (v1.0.0 ↔ version = "1.0.0"),
  # since that version is what the artifact file names carry.
  release:
    name: Release (v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hakai-core, hakai-linux, hakai-win, hakai-mac, hakai-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the crate versions
        run: |
          want="${GITHUB_REF_NAME#v}"
          for m in hakai-linux hakai-win hakai-mac hakai-android; do
            got="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' "$m/Cargo.toml" | head -1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$GITHUB_REF_NAME doesn't match $m/Cargo.toml version $got"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hakai $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
